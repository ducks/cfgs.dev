name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Package release
        run: |
          tar -czf cfgs-dev.tar.gz \
            .next \
            node_modules \
            package.json \
            public

      - name: Upload release
        uses: softprops/action-gh-release@v1
        with:
          files: cfgs-dev.tar.gz
